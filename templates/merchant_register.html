<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>انضم كتاجر - ASMAR MARKET</title>

<style>
body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f5f6f8;
}
.box{
    max-width:430px;
    margin:40px auto;
    background:white;
    padding:25px;
    border-radius:20px;
    box-shadow:0 5px 20px #0001;
}
h1{
    text-align:center;
}
input, select{
    width:100%;
    padding:14px;
    margin:8px 0;
    box-sizing:border-box;
    border:1px solid #ddd;
    border-radius:10px;
    background:white;
}
button{
    width:100%;
    padding:14px;
    margin-top:10px;
    border:0;
    border-radius:10px;
    background:#111;
    color:white;
    font-size:16px;
}
.gold{
    color:#b38b00;
}
.business-phone-info{
    margin:8px 0 12px;
    padding:12px 14px;
    border:1px solid #d6b25e;
    border-radius:12px;
    background:linear-gradient(135deg,#fffaf0,#fff);
    color:#555;
    font-size:12px;
    line-height:1.8;
    box-shadow:0 4px 14px #0000000d;
}
.business-phone-info strong{
    color:#9a741b;
}
.phone-recovery-link {
    margin: 10px 0 14px;
    text-align: center;
}

.phone-recovery-link a {
    display: inline-block;
    color: #9a741b;
    font-size: 13px;
    font-weight: 700;
    text-decoration: none;
    padding: 8px 14px;
    border: 1px solid #d6b25e;
    border-radius: 10px;
    background: #fffaf0;
}

.phone-recovery-link a:hover {
    text-decoration: underline;
}
</head>

<body>

<div class="box">

<h1>ASMAR <span class="gold">MARKET</span></h1>

<h2>🛍️ انضم كتاجر</h2>

<p>
أرسل بياناتك لطلب إنشاء متجرك.
سيتم مراجعة الطلب والموافقة عليه من إدارة المنصة.
</p>

<form method="POST">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">

<input
name="name"
placeholder="اسم المتجر أو التاجر"
required>

<label>رمز الدولة</label>

<select name="country_code" required>
    {% for country in countries %}
    <option value="{{ country['code'] }}"
        {% if country['code'] == '+967' %}selected{% endif %}>
        {{ country['name_ar'] }} ({{ country['code'] }})
    </option>
    {% endfor %}
</select>

<input
name="phone"
type="tel"
inputmode="tel"
placeholder="رقم الهاتف بدون رمز الدولة"
required>

<div class="business-phone-info">
    📱 <strong>استخدم رقم هاتفك الخاص بالعمل</strong><br>
    نرجو استخدام رقم هاتف خاص بالعمل، حتى يتمكن عملاؤك من التواصل معك بسهولة عند الحاجة.
    <br>
    شكرًا لانضمامك إلى <strong>ASMAR MARKET</strong> 👑
</div>

<input
name="password"
type="password"
placeholder="كلمة مرور المتجر"
required>

<button type="submit">
إرسال طلب الانضمام
</button>

<p style="text-align:center;margin-top:18px;">
    لديك حساب تاجر بالفعل؟
    <a href="/merchant/login" style="color:#b38b00;font-weight:900;text-decoration:none;">
        تسجيل الدخول
    </a>
</p>

{% if error %}
<p style="color:#c00;text-align:center;">{{ error }}</p>
{% endif %}

{% if phone_recovery_available %}
<div class="phone-recovery-link">
    <a href="/phone-recovery?role=merchant">
        هذا رقمي — أريد استعادة رقم الهاتف
    </a>
</div>
{% endif %}

</form>

</div>

</body>
</html>
