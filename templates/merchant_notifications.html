<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الإشعارات - ASMAR MARKET</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            color: #222;
        }

        header {
            background: #111;
            color: white;
            padding: 18px;
            text-align: center;
            font-size: 23px;
            font-weight: bold;
        }

        .container {
            max-width: 650px;
            margin: 25px auto;
            padding: 15px;
        }

        .notification {
            background: white;
            padding: 18px;
            margin-bottom: 12px;
            border-radius: 14px;
            box-shadow: 0 2px 8px rgba(0,0,0,.06);
        }

        .message {
            font-size: 17px;
            font-weight: bold;
        }

        .date {
            color: #777;
            margin-top: 8px;
            font-size: 13px;
        }

        .empty {
            background: white;
            padding: 30px;
            text-align: center;
            border-radius: 14px;
        }

        a {
            display: block;
            margin-top: 15px;
            text-align: center;
            text-decoration: none;
            color: #111;
            font-weight: bold;
        }
    </style>
</head>

<body>

<header>
    🔔 إشعاراتي
</header>

<div class="container">

    {% if notifications %}

        {% for notification in notifications %}

        <div class="notification">

            <div class="message">
                {{ notification['message'] }}
            </div>

            <div class="date">
                📅 {{ notification['created_at'] }}
            </div>

            {% if notification['order_id'] %}
            <a href="/merchant/orders">
                📦 مشاهدة الطلب
            </a>
            {% endif %}

        </div>

        {% endfor %}

    {% else %}

        <div class="empty">
            🔕 لا توجد إشعارات حاليًا
        </div>

    {% endif %}

    <a href="/merchant/dashboard">
        ↩️ العودة إلى لوحة التاجر
    </a>

</div>

</body>
</html>
