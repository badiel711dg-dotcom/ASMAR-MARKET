<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>إضافة إعلان - ASMAR MARKET</title>

<style>
body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f4f5f7;
    color:#171717;
}

header{
    background:#111;
    color:white;
    padding:22px;
}

.logo{
    font-size:24px;
    font-weight:bold;
}

.logo span{
    color:#d4af37;
}

.container{
    max-width:600px;
    margin:auto;
    padding:20px;
}

.card{
    background:white;
    padding:22px;
    border-radius:16px;
    box-shadow:0 3px 12px #0001;
}

label{
    display:block;
    margin:15px 0 7px;
    font-weight:bold;
}

input{
    width:100%;
    box-sizing:border-box;
    padding:13px;
    border:1px solid #ddd;
    border-radius:10px;
    font-size:16px;
}

button{
    width:100%;
    margin-top:20px;
    padding:14px;
    border:0;
    border-radius:10px;
    background:#111;
    color:white;
    font-size:17px;
    font-weight:bold;
}

.back{
    display:block;
    text-align:center;
    margin-top:15px;
    color:#111;
    text-decoration:none;
}
</style>
</head>

<body>

<header>
<div class="logo">
ASMAR <span>MARKET</span> 👑
</div>
</header>

<div class="container">

<div class="card">

<h1>➕ إضافة إعلان جديد</h1>

<form method="POST" enctype="multipart/form-data">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">

<label>اسم الإعلان</label>
<input type="text" name="title" placeholder="مثال: عروض الأزياء" required>

<label>التصنيف</label>
<input type="text" name="category" placeholder="مثال: أزياء">

<label>رابط الإعلان</label>
<input type="text" name="link" placeholder="/?category=أزياء">

<label>ترتيب الإعلان</label>
<input type="number" name="sort_order" value="1">

<label>صورة الإعلان</label>
<input type="file" name="image" accept="image/*">

<div style="margin-top:22px;padding:16px;border:1px solid #e5e5e5;border-radius:14px;background:#fafafa;">
    <h3 style="margin:0 0 14px;">🎛️ التحكم بحجم الإعلان</h3>

    <label>عرض البطاقة (px)</label>
    <input type="number" name="card_width" value="80" min="1" max="1000">

    <label>ارتفاع البطاقة (px)</label>
    <input type="number" name="card_height" value="50" min="1" max="1000">

    <label>عرض الصورة (px)</label>
    <input type="number" name="image_width" value="74" min="1" max="1000">

    <label>ارتفاع الصورة (px)</label>
    <input type="number" name="image_height" value="30" min="1" max="1000">

    <p style="margin:12px 0 0;color:#777;font-size:13px;">
        💡 يمكنك تغيير هذه القيم لكل إعلان بشكل مستقل.
    </p>
</div>

<button type="submit">
📢 إضافة الإعلان
</button>

</form>

<a class="back" href="/admin">
← العودة إلى لوحة المالك
</a>

</div>

</div>

</body>
</html>
