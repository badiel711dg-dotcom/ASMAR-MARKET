<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>إضافة إعلان - مودر ون</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f4f5f7;
    color:#171717;
}

header{
    background:#111;
    color:white;
    padding:20px;
}

.logo{
    font-size:24px;
    font-weight:bold;
}

.logo span{
    color:#d4af37;
}

.container{
    max-width:1100px;
    margin:auto;
    padding:20px;
}

.layout{
    display:grid;
    grid-template-columns:minmax(0,1fr) 380px;
    gap:20px;
    align-items:start;
}

.card{
    background:white;
    padding:22px;
    border-radius:16px;
    box-shadow:0 3px 12px #0001;
}

h1{
    margin-top:0;
}

label{
    display:block;
    margin:15px 0 7px;
    font-weight:bold;
}

input[type="text"],
input[type="number"],
input[type="file"]{
    width:100%;
    padding:13px;
    border:1px solid #ddd;
    border-radius:10px;
    font-size:16px;
}

.control{
    margin-top:18px;
}

.control-head{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    font-weight:bold;
}

.control-value{
    color:#b38b19;
    direction:ltr;
}

input[type="range"]{
    width:100%;
    margin-top:10px;
    accent-color:#111;
}

button{
    width:100%;
    margin-top:22px;
    padding:14px;
    border:0;
    border-radius:10px;
    background:#111;
    color:white;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
}

.preview-title{
    margin-top:0;
}

.preview-note{
    color:#666;
    font-size:13px;
    margin-bottom:12px;
}

.preview-window{
    width:100%;
    overflow:hidden;
    background:#f4f4f4;
    border-radius:12px;
    border:1px solid #ddd;
    position:relative;
}

.preview-slide{
    width:100%;
    height:270px;
    overflow:hidden;
    position:relative;
    background:#fff;
}

.preview-slide img{
    position:absolute;
    left:50%;
    top:50%;
    width:100%;
    height:100%;
    object-fit:contain;
    transform:
        translate(
            calc(-50% + 0px),
            calc(-50% + 0px)
        )
        scale(1);
    transform-origin:center center;
}

.empty-preview{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#999;
    font-weight:bold;
    text-align:center;
    padding:20px;
}

.back{
    display:block;
    text-align:center;
    margin-top:15px;
    color:#111;
    text-decoration:none;
}

@media(max-width:800px){
    .layout{
        grid-template-columns:1fr;
    }

    .preview-card{
        order:-1;
    }
}
</style>
</head>

<body>

<header>
<div class="logo">
MODER <span>ONE</span> 👑
</div>
</header>

<div class="container">

<div class="layout">

<div class="card">

<h1>➕ إضافة إعلان جديد</h1>

<form method="POST" enctype="multipart/form-data">
<input type="hidden" name="csrf_token" value="{{ csrf_token }}">

<input type="hidden" name="card_height" id="card_height" value="270">
<input type="hidden" name="image_scale" id="image_scale" value="1">
<input type="hidden" name="image_x" id="image_x" value="0">
<input type="hidden" name="image_y" id="image_y" value="0">

<label>اسم الإعلان</label>
<input type="text" name="title" placeholder="مثال: عروض الأزياء" required>

<label>التصنيف</label>
<input type="text" name="category" placeholder="مثال: أزياء">

<label>رابط الإعلان</label>
<input type="text" name="link" placeholder="/?category=أزياء">

<label>ترتيب الإعلان</label>
<input type="number" name="sort_order" value="1">

<label>صورة الإعلان</label>
<input type="file" id="imageInput" name="image" accept="image/*">

<div class="control">
    <div class="control-head">
        <span>ارتفاع الإعلان</span>
        <span class="control-value" id="heightValue">270px</span>
    </div>
    <input type="range" id="heightRange" min="50" max="600" value="270">
</div>

<div class="control">
    <div class="control-head">
        <span>تكبير الصورة</span>
        <span class="control-value" id="scaleValue">1.00×</span>
    </div>
    <input type="range" id="scaleRange" min="0.5" max="2.5" step="0.05" value="1">
</div>

<div class="control">
    <div class="control-head">
        <span>تحريك أفقي</span>
        <span class="control-value" id="xValue">0</span>
    </div>
    <input type="range" id="xRange" min="-100" max="100" step="1" value="0">
</div>

<div class="control">
    <div class="control-head">
        <span>تحريك عمودي</span>
        <span class="control-value" id="yValue">0</span>
    </div>
    <input type="range" id="yRange" min="-100" max="100" step="1" value="0">
</div>

<button type="submit">
📢 إضافة الإعلان
</button>

</form>

<a class="back" href="/admin">
← العودة إلى لوحة المالك
</a>

</div>

<div class="card preview-card">

<h2 class="preview-title">👁️ المعاينة المباشرة</h2>

<div class="preview-note">
شاهد شكل الإعلان أثناء ضبط المقاس والصورة.
</div>

<div class="preview-window">
    <div class="preview-slide" id="previewSlide">
        <img id="previewImage" alt="معاينة الإعلان" hidden>
        <div class="empty-preview" id="emptyPreview">
            اختر صورة الإعلان لعرض المعاينة
        </div>
    </div>
</div>

</div>

</div>
</div>

<script>
const imageInput = document.getElementById("imageInput");
const previewImage = document.getElementById("previewImage");
const emptyPreview = document.getElementById("emptyPreview");
const previewSlide = document.getElementById("previewSlide");

const heightRange = document.getElementById("heightRange");
const scaleRange = document.getElementById("scaleRange");
const xRange = document.getElementById("xRange");
const yRange = document.getElementById("yRange");

const heightValue = document.getElementById("heightValue");
const scaleValue = document.getElementById("scaleValue");
const xValue = document.getElementById("xValue");
const yValue = document.getElementById("yValue");

const cardHeight = document.getElementById("card_height");
const imageScale = document.getElementById("image_scale");
const imageX = document.getElementById("image_x");
const imageY = document.getElementById("image_y");

function updatePreview(){
    const height = Number(heightRange.value);
    const scale = Number(scaleRange.value);
    const x = Number(xRange.value);
    const y = Number(yRange.value);

    previewSlide.style.height = height + "px";

    previewImage.style.transform =
        "translate(calc(-50% + " + x + "px), calc(-50% + " + y + "px)) scale(" + scale + ")";

    heightValue.textContent = height + "px";
    scaleValue.textContent = scale.toFixed(2) + "×";
    xValue.textContent = x;
    yValue.textContent = y;

    cardHeight.value = height;
    imageScale.value = scale;
    imageX.value = x;
    imageY.value = y;
}

imageInput.addEventListener("change", function(){
    const file = this.files && this.files[0];

    if(!file){
        previewImage.hidden = true;
        emptyPreview.style.display = "flex";
        return;
    }

    const url = URL.createObjectURL(file);

    previewImage.src = url;
    previewImage.hidden = false;
    emptyPreview.style.display = "none";
});

[heightRange, scaleRange, xRange, yRange].forEach(function(control){
    control.addEventListener("input", updatePreview);
});

updatePreview();

const adForm = document.querySelector('form');

function compressAdImage(file) {
    return new Promise((resolve, reject) => {
        const img = new Image();
        const url = URL.createObjectURL(file);

        img.onload = function() {
            URL.revokeObjectURL(url);

            const maxSize = 1600;
            let width = img.naturalWidth;
            let height = img.naturalHeight;

            if (width > maxSize || height > maxSize) {
                const ratio = Math.min(maxSize / width, maxSize / height);
                width = Math.round(width * ratio);
                height = Math.round(height * ratio);
            }

            const canvas = document.createElement("canvas");
            canvas.width = width;
            canvas.height = height;

            const ctx = canvas.getContext("2d");
            ctx.drawImage(img, 0, 0, width, height);

            canvas.toBlob(function(blob) {
                if (!blob) {
                    reject(new Error("تعذر ضغط الصورة"));
                    return;
                }

                resolve(blob);
            }, "image/jpeg", 0.82);
        };

        img.onerror = function() {
            URL.revokeObjectURL(url);
            reject(new Error("تعذر قراءة الصورة"));
        };

        img.src = url;
    });
}

adForm.addEventListener("submit", async function(event){
    event.preventDefault();

    const submitButton = adForm.querySelector('button[type="submit"]');
    const originalText = submitButton.innerHTML;

    submitButton.disabled = true;
    submitButton.innerHTML = "⏳ جارٍ إضافة الإعلان...";

    try {
        const formData = new FormData(adForm);
        const csrfToken = formData.get("csrf_token") || "";
        const imageFile = imageInput.files && imageInput.files[0];

        if (imageFile) {
            const compressedImage = await compressAdImage(imageFile);
            formData.set("image", compressedImage, "ad-upload.jpg");
        }

        const response = await fetch(adForm.action || window.location.href, {
            method: "POST",
            body: formData,
            headers: {
                "X-CSRFToken": csrfToken
            },
            credentials: "same-origin"
        });

        if (response.redirected) {
            window.location.href = response.url;
            return;
        }

        const text = await response.text();

        if (response.ok) {
            document.open();
            document.write(text);
            document.close();
            return;
        }

        document.open();
        document.write(text);
        document.close();

    } catch (error) {
        console.error("AD SUBMIT ERROR:", error);
        alert("حدث خطأ أثناء إضافة الإعلان. حاول مرة أخرى.");
    } finally {
        submitButton.disabled = false;
        submitButton.innerHTML = originalText;
    }
});
</script>

</body>
</html>
