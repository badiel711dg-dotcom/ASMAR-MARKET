<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول | أسمر ماركت</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap');

        :root{
            --black:#202123;
            --gold:#C9A227;
            --gold-soft:#E8D9A8;
            --bg:#F7F7F8;
            --white:#FFFFFF;
            --text:#202123;
            --muted:#6B6B6B;
            --line:#E5E5E5;
        }

        *{box-sizing:border-box}

        html,body{min-height:100%}

        body{
            margin:0;
            min-height:100vh;
            padding:24px 14px;
            font-family:"Tajawal",Arial,Tahoma,sans-serif;
            color:var(--text);
            background:
                radial-gradient(circle at 12% 12%,rgba(201,162,39,.10),transparent 30%),
                radial-gradient(circle at 88% 88%,rgba(32,33,35,.055),transparent 34%),
                var(--bg);
            display:flex;
            align-items:center;
            justify-content:center;
        }

        body:before{
            content:"";
            position:fixed;
            inset:0;
            pointer-events:none;
            background:
                linear-gradient(115deg,
                    transparent 0%,
                    rgba(255,255,255,.72) 42%,
                    transparent 68%);
            opacity:.8;
        }

        .box{
            position:relative;
            width:100%;
            max-width:430px;
            margin:0 auto;
            padding:38px 28px 30px;
            background:rgba(255,255,255,.96);
            border:1px solid rgba(201,162,39,.28);
            border-radius:26px;
            box-shadow:
                0 30px 80px rgba(32,33,35,.10),
                0 6px 20px rgba(32,33,35,.055);
        }

        .box:before{
            content:"";
            display:block;
            width:58px;
            height:2px;
            margin:0 auto 25px;
            border-radius:10px;
            background:linear-gradient(
                90deg,
                transparent,
                var(--gold),
                transparent
            );
        }

        .brand{
            text-align:center;
            margin-bottom:8px;
            color:var(--black);
            font-size:15px;
            font-weight:800;
            letter-spacing:.5px;
        }

        .brand span{
            color:var(--gold);
        }

        h2{
            margin:0;
            text-align:center;
            color:var(--black);
            font-size:25px;
            line-height:1.5;
            font-weight:900;
            letter-spacing:0;
        }

        .welcome{
            margin:7px 0 25px;
            text-align:center;
            color:var(--muted);
            font-size:14px;
            font-weight:500;
            line-height:1.8;
        }

        input,select{
            width:100%;
            box-sizing:border-box;
            padding:14px 15px;
            margin:7px 0;
            border:1px solid var(--line);
            border-radius:13px;
            background:#FFFFFF;
            color:var(--text);
            font-family:inherit;
            font-size:16px;
            outline:none;
            transition:border-color .2s ease,box-shadow .2s ease,background .2s ease;
        }

        input:focus,select:focus{
            border-color:var(--gold);
            background:#fff;
            box-shadow:0 0 0 4px rgba(201,162,39,.10);
        }

        input::placeholder{
            color:#929292;
        }

        select{
            appearance:auto;
        }

        button{
            width:100%;
            padding:15px;
            margin-top:15px;
            border:0;
            border-radius:13px;
            background:var(--black);
            color:#fff;
            font-family:inherit;
            font-size:17px;
            font-weight:800;
            cursor:pointer;
            box-shadow:0 10px 24px rgba(32,33,35,.16);
            transition:transform .2s ease,box-shadow .2s ease;
        }

        button:hover{
            transform:translateY(-1px);
            box-shadow:0 14px 30px rgba(32,33,35,.22);
        }

        button:active{
            transform:translateY(0);
        }

        .error{
            background:#fff7f6;
            color:#a33b36;
            border:1px solid #efd1cf;
            padding:11px 12px;
            border-radius:11px;
            text-align:center;
            margin-bottom:13px;
            font-size:14px;
        }

        .register{
            text-align:center;
            margin-top:21px;
            color:var(--muted);
            font-size:14px;
        }

        a{
            color:var(--black);
            font-weight:800;
            text-decoration:none;
            border-bottom:1px solid rgba(201,162,39,.65);
            padding-bottom:1px;
        }

        a:hover{
            color:var(--gold);
        }

        @media(max-width:480px){
            body{
                padding:16px 11px;
            }

            .box{
                padding:32px 18px 25px;
                border-radius:23px;
            }

            h2{
                font-size:22px;
            }
        }
    </style>
</head>
<body>

<div class="box">
    <div class="brand">ASMAR <span>MARKET</span></div>
    <h2>مرحبًا بعودتك إلى أسمر ماركت</h2>
    <div class="welcome">اكتشف ما تحب، واجعل اختيارك أسهل.</div>

    {% if error %}
        <div class="error">{{ error }}</div>
    {% endif %}

    <form method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <input
            type="search"
            id="countrySearch"
            placeholder="ابحث عن الدولة أو رمزها مثل 966"
            autocomplete="off"
        >

        <div style="display:flex;gap:8px;direction:ltr;">
            <select name="country_code" id="countryCode" required
                    style="width:38%;box-sizing:border-box;padding:14px;border:1px solid #ddd;border-radius:10px;font-size:16px;background:white;">
                {% for country in countries %}
                    <option
                        value="{{ country.code }}"
                        data-search="{{ country.name_ar }} {{ country.name_en }} {{ country.code }} {{ country.region }}"
                        {% if country.code == "+967" %}selected{% endif %}
                    >
                        {{ country.name_ar }} {{ country.code }}
                    </option>
                {% endfor %}
            </select>

            <input type="tel"
                   name="phone"
                   placeholder="رقم الهاتف"
                   required
                   inputmode="numeric"
                   autocomplete="tel-national"
                   style="width:62%;margin:8px 0;">
        </div>

        <script>
        const countrySearch = document.getElementById("countrySearch");
        const countryCode = document.getElementById("countryCode");

        countrySearch.addEventListener("input", function () {
            const query = this.value.trim().toLowerCase();
            let firstMatch = null;

            for (const option of countryCode.options) {
                const text = option.dataset.search.toLowerCase();
                const match = !query || text.includes(query);

                option.hidden = !match;

                if (match && !firstMatch) {
                    firstMatch = option;
                }
            }

            if (firstMatch) {
                countryCode.value = firstMatch.value;
            }
        });
        </script>
        <input type="password" name="password" placeholder="كلمة المرور" required>

        <button type="submit">دخول</button>
    </form>

    <div class="register">
        ليس لديك حساب؟ <a href="/customer/register">إنشاء حساب جديد</a>
    </div>
</div>

</body>
</html>
