<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>تم الطلب - ASMAR MARKET</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            color: #222;
        }

        .container {
            max-width: 600px;
            margin: 60px auto;
            padding: 20px;
        }

        .box {
            background: white;
            padding: 30px 20px;
            border-radius: 18px;
            text-align: center;
        }

        .icon {
            font-size: 60px;
        }

        h1 {
            margin: 15px 0;
        }

        .order-number {
            background: #f0f0f0;
            padding: 15px;
            border-radius: 12px;
            font-size: 20px;
            font-weight: bold;
            margin: 20px 0;
        }

        .total {
            font-size: 21px;
            font-weight: bold;
            margin: 20px 0;
        }

        .back {
            display: block;
            background: #111;
            color: white;
            text-decoration: none;
            padding: 15px;
            border-radius: 12px;
            margin-top: 20px;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="box">

        <div class="icon">✅</div>

        <h1>تم استلام طلبك بنجاح</h1>

        <p>
            شكرًا لك، تم تسجيل طلبك في ASMAR MARKET.
        </p>

        <div class="order-number">
            رقم الطلب: #{{ order['id'] }}
        </div>

        <div class="total">
            الإجمالي: {{ order['total'] }} {{ order['currency'] or 'YER' }}
        </div>

        <p>
            سيتم التواصل معك لتأكيد الطلب والتوصيل.
        </p>

        <a class="back" href="/">
            🏠 العودة إلى المتجر
        </a>

    </div>

</div>

</body>
</html>
