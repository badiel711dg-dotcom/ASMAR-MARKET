<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>دخول التاجر | مودر ون</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap');

:root{
 --black:#202123;
 --gold:#B3122D;
 --gold-soft:#F0B8C2;
 --bg:#F7F7F8;
 --white:#FFFFFF;
 --text:#202123;
 --muted:#6B6B6B;
 --line:#E5E5E5;
}

*{box-sizing:border-box}

html,body{min-height:100%}

body{
 margin:0;
 min-height:100vh;
 padding:24px 14px;
 font-family:"Tajawal",Arial,Tahoma,sans-serif;
 color:var(--text);
 background:
  radial-gradient(circle at 12% 12%,rgba(201,162,39,.10),transparent 30%),
  radial-gradient(circle at 88% 88%,rgba(32,33,35,.055),transparent 34%),
  var(--bg);
 display:flex;
 align-items:center;
 justify-content:center;
}

body:before{
 content:"";
 position:fixed;
 inset:0;
 pointer-events:none;
 background:
  linear-gradient(115deg,
   transparent 0%,
   rgba(255,255,255,.72) 42%,
   transparent 68%);
 opacity:.8;
}

.box{
 position:relative;
 width:100%;
 max-width:430px;
 margin:0 auto;
 padding:38px 28px 30px;
 background:rgba(255,255,255,.96);
 border:1px solid rgba(201,162,39,.28);
 border-radius:26px;
 box-shadow:
  0 30px 80px rgba(32,33,35,.10),
  0 6px 20px rgba(32,33,35,.055);
}

.box:before{
 content:"";
 display:block;
 width:58px;
 height:2px;
 margin:0 auto 25px;
 border-radius:10px;
 background:linear-gradient(90deg,transparent,var(--gold),transparent);
}

.brand{
 text-align:center;
 margin-bottom:8px;
 color:var(--black);
 font-size:15px;
 font-weight:800;
 letter-spacing:.5px;
}

.brand span{
 color:var(--gold);
}

h1{
 margin:0;
 text-align:center;
 color:var(--black);
 font-size:25px;
 line-height:1.5;
 font-weight:900;
 letter-spacing:0;
}

.gold{
 color:var(--gold);
}

h2{
 margin:7px 0 25px;
 text-align:center;
 color:var(--muted);
 font-size:14px;
 line-height:1.8;
 font-weight:500;
}

label{
 display:block;
 margin:14px 0 7px;
 color:var(--black);
 font-size:14px;
 font-weight:800;
}

input,select{
 width:100%;
 padding:14px 15px;
 margin:7px 0;
 border:1px solid var(--line);
 border-radius:13px;
 background:#FFFFFF;
 color:var(--text);
 font-family:inherit;
 font-size:16px;
 outline:none;
 transition:border-color .2s ease,box-shadow .2s ease,background .2s ease;
}

input:focus,select:focus{
 border-color:var(--gold);
 background:#fff;
 box-shadow:0 0 0 4px rgba(201,162,39,.10);
}

input::placeholder{
 color:#929292;
}

button{
 width:100%;
 padding:15px;
 margin-top:17px;
 border:0;
 border-radius:13px;
 background:var(--black);
 color:#fff;
 font-family:inherit;
 font-size:17px;
 font-weight:800;
 cursor:pointer;
 box-shadow:0 10px 24px rgba(32,33,35,.16);
 transition:transform .2s ease,box-shadow .2s ease;
}

button:hover{
 transform:translateY(-1px);
 box-shadow:0 14px 30px rgba(32,33,35,.22);
}

button:active{
 transform:translateY(0);
}

.error{
 background:#fff7f6;
 color:#a33b36;
 border:1px solid #efd1cf;
 padding:12px;
 border-radius:11px;
 text-align:center;
 margin-bottom:14px;
 font-size:14px;
}

a{
 color:var(--black);
 font-weight:800;
 text-decoration:none;
}

a:hover{
 color:var(--gold);
}

@media(max-width:480px){
 body{
  padding:16px 11px;
 }

 .box{
  padding:32px 18px 25px;
  border-radius:23px;
 }

 h1{
  font-size:22px;
 }

 h2{
  font-size:14px;
 }
}

/* ===== MODER ONE — MERCHANT LOGIN RED/BLACK ===== */

.brand{
    color:#111111 !important;
}

.brand span{
    color:#B3122D !important;
}

/* الخط فوق الشعار */
.box:before{
    background:linear-gradient(
        90deg,
        transparent,
        #B3122D,
        transparent
    ) !important;
}

/* الحقول عند الضغط */
input:focus,
select:focus,
textarea:focus{
    border-color:#B3122D !important;
    outline:none !important;
    box-shadow:0 0 0 3px rgba(179,18,45,.12) !important;
}

input,
select,
textarea{
    caret-color:#B3122D;
}

/* زر الدخول */
button[type="submit"]{
    border:1.5px solid #B3122D !important;
    background:transparent !important;
    color:#B3122D !important;
    border-radius:12px !important;
}

button[type="submit"]:hover{
    background:#B3122D !important;
    color:#FFFFFF !important;
}

/* إطار نموذج الدخول */
.box{
    border-color:#B3122D !important;
}

</style>
</head>

<body>

<div class="box">

<div class="brand">MODER <span>ONE</span></div>

<h1>مرحبًا بعودتك إلى مودر ون</h1>

<h2>واصل نجاحك… فطموحك يستحق المزيد.</h2>

{% if error %}
<p class="error">{{ error }}</p>
{% endif %}

<form method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">

<label>رمز الدولة</label>

<select name="country_code" required>
    {% for country in countries %}
    <option value="{{ country['code'] }}"
        {% if country['code'] == '+967' %}selected{% endif %}>
        {{ country['name_ar'] }} ({{ country['code'] }})
    </option>
    {% endfor %}
</select>

<input
name="phone"
type="tel"
inputmode="tel"
placeholder="رقم الهاتف بدون رمز الدولة"
required>

<input
name="password"
type="password"
placeholder="كلمة المرور"
required>

<button type="submit">
دخول المتجر
</button>

</form>

</div>

</body>
</html>
