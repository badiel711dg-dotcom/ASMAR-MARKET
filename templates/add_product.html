<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>إضافة منتج - ASMAR MARKET</title>

<style>
body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f5f5f5;
    color:#222;
}

.container{
    max-width:600px;
    margin:30px auto;
    padding:20px;
}

.card{
    background:white;
    padding:25px;
    border-radius:18px;
    box-shadow:0 5px 25px #0001;
}

h1{
    text-align:center;
}

label{
    display:block;
    margin-top:15px;
    font-weight:bold;
}

input,textarea{
    width:100%;
    box-sizing:border-box;
    padding:13px;
    margin-top:7px;
    border:1px solid #ddd;
    border-radius:10px;
    font-size:16px;
}

textarea{
    min-height:110px;
    resize:vertical;
}

input[type="file"]{
    padding:10px;
}

button{
    width:100%;
    margin-top:20px;
    padding:15px;
    border:0;
    border-radius:12px;
    background:#111;
    color:white;
    font-size:18px;
    font-weight:bold;
}

#preview{
    display:none;
    width:100%;
    max-height:300px;
    object-fit:contain;
    margin-top:15px;
    border-radius:12px;
}

.variants-box{
    margin-top:18px;
    padding:15px;
    border:1px solid #e5e5e5;
    border-radius:14px;
    background:#fafafa;
}

.variants-toggle{
    display:flex;
    align-items:center;
    gap:9px;
    margin:0;
    cursor:pointer;
}

.variants-toggle input{
    width:auto;
    margin:0;
    transform:scale(1.15);
}

.variants-head{
    margin-top:16px;
    margin-bottom:10px;
}

.variants-head strong{
    display:block;
    font-size:15px;
}

.variants-head span{
    display:block;
    margin-top:4px;
    color:#888;
    font-size:12px;
}

.variant-row{
    display:grid;
    grid-template-columns:1fr 1fr 90px 42px;
    gap:7px;
    align-items:center;
    margin-top:8px;
}

.variant-row input{
    margin:0;
    padding:10px;
    font-size:14px;
}

.remove-variant-btn{
    width:42px;
    height:42px;
    margin:0;
    padding:0;
    border-radius:10px;
    background:#eee;
    color:#b00020;
    font-size:18px;
}

.add-variant-btn{
    width:100%;
    margin-top:12px;
    padding:11px;
    border-radius:10px;
    background:#202123;
    font-size:14px;
}

.variants-total{
    margin-top:12px;
    text-align:center;
    font-weight:bold;
    font-size:14px;
    color:#202123;
}

@media (max-width:520px){
    .variant-row{
        grid-template-columns:1fr 1fr;
    }

    .variant-row input[name="variant_stock[]"]{
        grid-column:1;
    }

    .remove-variant-btn{
        grid-column:2;
        justify-self:end;
    }
}
</style>
</head>

<body>

<div class="container">
<div class="card">

<h1>👑 إضافة منتج</h1>

<form method="POST"
      action="/merchant/product/add"
      enctype="multipart/form-data">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">

<label>اسم المنتج</label>
<input type="text"
       name="name"
       placeholder="مثال: عطر ASMAR"
       required>

<label>السعر الحالي</label>
<input type="number"
       name="price"
       placeholder="مثال: 1500"
       min="0"
       step="0.01"
       required>

<label>السعر قبل الخصم <span style="font-size:12px;color:#888;">(اختياري)</span></label>
<input type="number"
       name="original_price"
       placeholder="مثال: 2000"
       min="0"
       step="0.01">

<p style="margin:-4px 0 14px;color:#888;font-size:12px;line-height:1.7;">
إذا كان هناك خصم، أدخل السعر القديم هنا. يجب أن يكون أكبر من السعر الحالي.
</p>

<label>الكمية المتوفرة</label>
<input type="number"
       id="main-stock"
       name="stock"
       placeholder="مثال: 12"
       min="0"
       required>

<div class="variants-box">
    <label class="variants-toggle">
        <input type="checkbox"
               id="has-variants"
               name="has_variants"
               value="1"
               onchange="toggleVariants()">
        <span>المنتج يحتوي على ألوان ومقاسات</span>
    </label>

    <div id="variants-section" style="display:none;">

        <div class="variants-head">
            <strong>المخزون حسب اللون والمقاس</strong>
            <span>أضف كل تركيبة متوفرة عند التاجر</span>
        </div>

        <div id="variants-list"></div>

        <button type="button"
                class="add-variant-btn"
                onclick="addVariantRow()">
            + إضافة لون / مقاس
        </button>

        <div id="variants-total" class="variants-total">
            إجمالي المخزون: 0
        </div>

    </div>
</div>

<label>تصنيف المنتج</label>
<select name="category" required>
    <option value="أزياء">أزياء وملابس</option>
    <option value="أحذية وحقائب">أحذية وحقائب</option>
    <option value="مجوهرات وإكسسوارات">مجوهرات وإكسسوارات</option>
    <option value="جمال وعناية">جمال وعناية</option>
    <option value="إلكترونيات">إلكترونيات وتقنية</option>
    <option value="منزل وأثاث">منزل وأثاث</option>
    <option value="مطبخ">مطبخ وأدوات منزلية</option>
    <option value="مفروشات وديكور">مفروشات وديكور</option>
    <option value="أطفال وأمهات">أطفال وأمهات</option>
    <option value="ألعاب وهوايات">ألعاب وهوايات</option>
    <option value="رياضة ولياقة">رياضة ولياقة</option>
    <option value="سيارات ومركبات">سيارات ومركبات</option>
    <option value="أدوات ومعدات">أدوات ومعدات</option>
    <option value="كتب وتعليم">كتب وتعليم</option>
    <option value="أغذية ومشروبات">أغذية ومشروبات</option>
    <option value="عطور وهدايا">عطور وهدايا وورود</option>
    <option value="حيوانات">مستلزمات الحيوانات</option>
    <option value="زراعة وحدائق">زراعة وحدائق</option>
    <option value="مكاتب وتجاري">مكاتب ومستلزمات تجارية</option>
    <option value="خدمات">خدمات</option>
    <option value="مستعمل">مستعمل</option>
    <option value="أخرى">أخرى</option>
</select>

<label>عملة المنتج 💰</label>
<select name="currency" required>
    <option value="YER">🇾🇪 ريال يمني (YER)</option>
    <option value="SAR">🇸🇦 ريال سعودي (SAR)</option>
    <option value="USD">🇺🇸 دولار أمريكي (USD)</option>
    <option value="AED">🇦🇪 درهم إماراتي (AED)</option>
    <option value="EGP">🇪🇬 جنيه مصري (EGP)</option>
    <option value="KWD">🇰🇼 دينار كويتي (KWD)</option>
    <option value="EUR">🇪🇺 يورو (EUR)</option>
    <option value="GBP">🇬🇧 جنيه إسترليني (GBP)</option>
    <option value="OTHER">🌍 عملة أخرى</option>
</select>

<label>وصف المنتج</label>
<textarea name="description"
          placeholder="اكتب وصف المنتج هنا..."
          required></textarea>

<label>صورة المنتج 📷</label>
<input type="file"
       name="image"
       accept="image/*"
       onchange="previewImage(event)"
       required>

<img id="preview">

<button type="submit">
    🚀 نشر المنتج
</button>

</form>

</div>
</div>

<script>
function previewImage(event){
    const file = event.target.files[0];
    const preview = document.getElementById("preview");

    if(file){
        preview.src = URL.createObjectURL(file);
        preview.style.display = "block";
    }
}

function toggleVariants(){
    const checkbox = document.getElementById("has-variants");
    const section = document.getElementById("variants-section");
    const mainStock = document.getElementById("main-stock");

    if(checkbox.checked){
        section.style.display = "block";
        mainStock.value = "0";
        mainStock.disabled = true;

        if(document.querySelectorAll(".variant-row").length === 0){
            addVariantRow();
        }
    }else{
        section.style.display = "none";
        mainStock.disabled = false;
        mainStock.required = true;
    }

    updateVariantsTotal();
}

function addVariantRow(){
    const list = document.getElementById("variants-list");

    const row = document.createElement("div");
    row.className = "variant-row";

    row.innerHTML = `
        <input type="text"
               name="variant_color[]"
               placeholder="اللون مثل: أسود"
               maxlength="50">

        <input type="text"
               name="variant_size[]"
               placeholder="المقاس مثل: M"
               maxlength="30">

        <input type="number"
               name="variant_stock[]"
               placeholder="الكمية"
               min="0"
               step="1"
               value="0">

        <button type="button"
                class="remove-variant-btn"
                onclick="removeVariantRow(this)"
                aria-label="حذف المتغير">
            ×
        </button>
    `;

    list.appendChild(row);

    row.querySelectorAll("input").forEach(input => {
        input.addEventListener("input", updateVariantsTotal);
    });

    updateVariantsTotal();
}

function removeVariantRow(button){
    const row = button.closest(".variant-row");
    if(row){
        row.remove();
    }

    updateVariantsTotal();
}

function updateVariantsTotal(){
    const rows = document.querySelectorAll(".variant-row");
    let total = 0;

    rows.forEach(row => {
        const input = row.querySelector('input[name="variant_stock[]"]');
        const value = parseInt(input?.value || "0", 10);

        if(Number.isFinite(value) && value > 0){
            total += value;
        }
    });

    document.getElementById("variants-total").textContent =
        "إجمالي المخزون: " + total;
}
</script>

</body>
</html>
