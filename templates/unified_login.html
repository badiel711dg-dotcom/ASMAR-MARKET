<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول | MODER ONE</title>

    <style>
        :root{
            --black:#090909;
            --card:#11100e;
            --gold:#c99a45;
            --gold-soft:#e0bd76;
            --text:#f5f1e8;
            --muted:#a9a39a;
            --border:rgba(201,154,69,.25);
        }

        *{
            box-sizing:border-box;
        }

        body{
            margin:0;
            min-height:100vh;
            display:flex;
            align-items:center;
            justify-content:center;
            padding:24px;
            background:
                radial-gradient(circle at top, rgba(201,154,69,.10), transparent 38%),
                var(--black);
            color:var(--text);
            font-family:Arial, Tahoma, sans-serif;
        }

        .login-card{
            width:100%;
            max-width:520px;
            background:rgba(17,16,14,.72);
            border:1px solid rgba(201,154,69,.18);
            border-radius:22px;
            padding:36px 30px;
            box-shadow:0 18px 55px rgba(0,0,0,.35);
            backdrop-filter:blur(10px);
        }

        .brand{
            text-align:center;
            margin-bottom:30px;
        }

        .brand-name{
            font-size:30px;
            font-weight:900;
            letter-spacing:2px;
            color:var(--gold);
        }

        .brand-sub{
            margin-top:7px;
            color:var(--muted);
            font-size:14px;
        }

        h1{
            text-align:center;
            font-size:22px;
            margin:0 0 24px;
        }

        label{
            display:block;
            margin-bottom:8px;
            font-size:14px;
            color:#ddd5c8;
        }

        input,
        select{
            width:100%;
            height:50px;
            border-radius:13px;
            border:1px solid rgba(255,255,255,.10);
            background:#0b0b0a;
            color:var(--text);
            padding:0 14px;
            outline:none;
            margin-bottom:17px;
        }

        input:focus,
        select:focus{
            border-color:var(--gold);
        }

        .role-title{
            margin:5px 0 11px;
            color:#ddd5c8;
            font-size:14px;
        }

        .roles{
            display:grid;
            grid-template-columns:1fr 1fr;
            gap:10px;
            margin-bottom:20px;
        }

        .role{
            position:relative;
        }

        .role input{
            position:absolute;
            opacity:0;
            pointer-events:none;
        }

        .role label{
            min-height:78px;
            margin:0;
            padding:14px 10px;
            border:1px solid rgba(255,255,255,.10);
            border-radius:15px;
            background:#0c0c0b;
            cursor:pointer;
            text-align:center;
            display:flex;
            flex-direction:column;
            justify-content:center;
            gap:5px;
        }

        .role input:checked + label{
            border-color:var(--gold);
            background:rgba(201,154,69,.09);
            box-shadow:inset 0 0 0 1px rgba(201,154,69,.18);
        }

        .role-icon{
            font-size:22px;
        }

        .role-name{
            font-weight:700;
            color:#f2eadc;
        }

        .role-desc{
            font-size:11px;
            color:var(--muted);
        }

        .remember{
            display:flex;
            align-items:center;
            gap:8px;
            margin:2px 0 20px;
            color:var(--muted);
            font-size:13px;
        }

        .remember input{
            width:17px;
            height:17px;
            margin:0;
            accent-color:var(--gold);
        }

        .login-btn{
            width:100%;
            height:52px;
            border:1px solid rgba(201,154,69,.55);
            border-radius:13px;
            background:linear-gradient(135deg,#d5ad61,#b88638);
            color:#17120a;
            font-size:16px;
            font-weight:800;
            cursor:pointer;
        }

        .create{
            text-align:center;
            margin-top:22px;
            color:var(--muted);
            font-size:14px;
        }

        .create a{
            color:var(--gold-soft);
            text-decoration:none;
            font-weight:700;
        }

        .error{
            background:rgba(170,40,40,.12);
            border:1px solid rgba(220,80,80,.25);
            color:#ffb5b5;
            border-radius:12px;
            padding:11px 13px;
            margin-bottom:18px;
            font-size:13px;
            text-align:center;
        }

        @media(max-width:420px){
            .login-card{
                padding:28px 20px;
            }

            .brand-name{
                font-size:26px;
            }
        }
    </style>
</head>

<body>

<div class="login-card">

    <div class="brand">
        <div class="brand-name">MODER ONE</div>
        <div class="brand-sub">تجربة تسوق مختلفة</div>
    </div>

    <h1>تسجيل الدخول</h1>

    {% if error %}
        <div class="error">{{ error }}</div>
    {% endif %}

    <form method="POST" action="/login">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">

        <label for="phone">رقم الهاتف</label>
        <input
            type="tel"
            id="phone"
            name="phone"
            placeholder="أدخل رقم هاتفك"
            required
        >

        <label for="country_code">رمز الدولة</label>
        <select id="country_code" name="country_code">
            {% for country in countries %}
                <option value="{{ country.code }}"
                    {% if country.code == '+967' %}selected{% endif %}>
                    {{ country.name }} {{ country.code }}
                </option>
            {% endfor %}
        </select>

        <label for="password">كلمة المرور</label>
        <input
            type="password"
            id="password"
            name="password"
            placeholder="أدخل كلمة المرور"
            required
        >

        <div class="role-title">أنا أدخل كـ:</div>

        <div class="roles">

            <div class="role">
                <input
                    type="radio"
                    id="customer_role"
                    name="role"
                    value="customer"
                    checked
                >
                <label for="customer_role">
                    <span class="role-icon">🛍️</span>
                    <span class="role-name">عميل</span>
                    <span class="role-desc">أريد التسوق</span>
                </label>
            </div>

            <div class="role">
                <input
                    type="radio"
                    id="merchant_role"
                    name="role"
                    value="merchant"
                >
                <label for="merchant_role">
                    <span class="role-icon">🏪</span>
                    <span class="role-name">تاجر</span>
                    <span class="role-desc">أريد إدارة متجري</span>
                </label>
            </div>

        </div>

        <label class="remember">
            <input type="checkbox" name="remember">
            <span>تذكرني على هذا الجهاز</span>
        </label>

        <button type="submit" class="login-btn">
            تسجيل الدخول
        </button>

    </form>

    <div class="create">
        ليس لديك حساب؟
        <a href="/register">إنشاء حساب جديد</a>
    </div>

</div>

</body>
</html>
